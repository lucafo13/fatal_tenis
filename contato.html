  <form class="form" id="formu">

      <label for="">Nome de usuario</label>
      <input type="text" id="nome" name="" placeholder="Seu nome aqui" id="" class="form-control">

  <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js">
</script>
<script type="text/javascript">
   (function(){
      emailjs.init({


        publicKey: "5_JqmtV7HfHYu5zbd",
      });
   })();
   

const send = document.getElementById('formu')
send.addEventListener('submit', (e) => {
    e.preventDefault()
    const nome = document.getElementById('nome').value
const email = document.getElementById('email').value
const msg = document.getElementById('msg').value
    if(nome === "" || email === "" || msg === "") {
        return alert("preencha os campos")
    } 
    emailjs.send(
    'service_6vp4bi1', 'template_4026jfk', 
    {
     nome: nome,
     email: email,
    mensagem: msg
    }
    
).then(() => {

    alert(`email enviado com o nome de ${nome} com sucesso`)
    send.reset()
})
})

</script>
