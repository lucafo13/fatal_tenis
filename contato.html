<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f9fa">
  <meta name="description" content="Fale com a equipe Fatal Tenis. Envie sua dúvida, sugestão ou mensagem.">
  <title>Contato — Fatal Tenis</title>
  <link rel="shortcut icon" href="Logo fataltenis minimalista em vermelho【7†source】.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <div class="page-veil"><span>FATAL TENIS</span></div>
  <div id="swup" class="transition-scene" data-page-title="Contato — Fatal Tenis">
  <div class="scroll-progress"></div>

  <header class="site-header">
    <nav class="navbar">
      <a class="brand" href="index.html">
        <img src="logo fataltenis minimalista em vermelho【7†source】.png" alt="Fatal Tenis">
      </a>
      <button class="menu-toggle" type="button">
        <span class="menu-toggle-label visually-hidden">Abrir menu</span>
        <span class="menu-toggle-bar menu-toggle-bar--first"></span>
        <span class="menu-toggle-bar menu-toggle-bar--last"></span>
      </button>
      <div class="nav-links" id="site-menu">
        <a class="nav-link" href="index.html">Início</a>
        <a class="nav-link" href="produtos.html">Produtos</a>
        <a class="nav-link" href="index.html#comentarios">Comentários</a>
        <a class="nav-link" href="index.html#local">Localização</a>
        <a class="nav-cta" href="contato.html">Contato <span>↗</span></a>
      </div>
    </nav>
  </header>

  <main>
    <div class="titu contact-title" data-reveal>
      <h1>Formulário de contato</h1>
    </div>
    <p class="contact-hint">Dúvidas, sugestões ou outras informações? Preencha o formulário abaixo.</p>

    <section class="separa contact-layout">
      <form class="form" id="formu" data-reveal>
        <div class="form-group">
          <label for="nome">Nome de usuário</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome aqui" class="form-control" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="voce@email.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="msg">Mensagem</label>
          <textarea class="form-control" id="msg" name="mensagem" rows="4" placeholder="Como podemos ajudar?" required></textarea>
        </div>
        <p class="form-status" id="email-status"></p>
        <button type="submit" class="btn contact-submit">Enviar mensagem</button>
      </form>

      <img src="re.png" class="lula contact-art" alt="Sapato azul de salto alto" data-reveal>
    </section>
  </main>

  <footer class="site-footer">
    <span>&copy; 2026 Fatal Tenis. Todos os direitos reservados.</span>
    <a href="index.html">Voltar ao início ↑</a>
  </footer>

  </div>
  <script src="home.js"></script>
  <script src="produtos.js"></script>
  <script src="site.js"></script>
</body>
</html>
