<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f9fa">
  <meta name="description" content="Fale com a equipe Fatal Tenis. Envie sua dúvida, sugestão ou mensagem.">
  <title>Contato — Fatal Tenis</title>
  <link rel="shortcut icon" href="Logo fataltenis minimalista em vermelho【7†source】.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <div class="scroll-progress" aria-hidden="true"></div>

  <header class="site-header">
    <nav class="navbar" aria-label="Navegação principal">
      <a class="brand" href="index.html" aria-label="Fatal Tenis — início">
        <img src="logo fataltenis minimalista em vermelho【7†source】.png" alt="Fatal Tenis">
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Abrir menu">
        <span></span><span></span>
      </button>
      <div class="nav-links" id="site-menu">
        <a class="nav-link" href="index.html">Início</a>
        <a class="nav-link" href="produtos.html">Produtos</a>
        <a class="nav-link" href="index.html#comentarios">Comentários</a>
        <a class="nav-link" href="index.html#local">Localização</a>
        <a class="nav-cta" href="contato.html" aria-current="page">Contato <span aria-hidden="true">↗</span></a>
      </div>
    </nav>
  </header>

  <main>
    <div class="titu contact-title" data-reveal>
      <h1>Formulário de contato</h1>
    </div>
    <p class="contact-hint">Dúvidas, sugestões ou outras informações? Preencha o formulário abaixo.</p>

    <section class="separa contact-layout" aria-label="Envie uma mensagem para a Fatal Tenis">
      <form class="form" id="formu" data-reveal>
        <div class="form-group">
          <label for="nome">Nome de usuário</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome aqui" class="form-control" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="voce@email.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="msg">Mensagem</label>
          <textarea class="form-control" id="msg" name="mensagem" rows="4" placeholder="Como podemos ajudar?" required></textarea>
        </div>
        <p class="form-status" id="email-status" role="status" aria-live="polite"></p>
        <button type="submit" class="btn contact-submit">Enviar mensagem</button>
      </form>

      <img src="re.png" class="lula contact-art" alt="Sapato azul de salto alto" data-reveal>
    </section>
  </main>

  <footer class="site-footer">
    <span>&copy; 2026 Fatal Tenis. Todos os direitos reservados.</span>
    <a href="index.html">Voltar ao início ↑</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js"></script>
  <script>
    const form = document.getElementById("formu");
    const emailStatus = document.getElementById("email-status");
    const selectedItems = new URLSearchParams(window.location.search).get("itens");
    let emailServiceReady = false;

    if (selectedItems) {
      document.getElementById("msg").value = `Olá! Tenho interesse nestes modelos: ${selectedItems}.`;
    }

    if (window.emailjs) {
      try {
        window.emailjs.init({ publicKey: "5_JqmtV7HfHYu5zbd" });
        emailServiceReady = true;
      } catch (error) {
        console.error("Falha ao inicializar o envio de mensagens:", error);
        emailStatus.textContent = "O envio está temporariamente indisponível. Tente novamente mais tarde.";
      }
    } else {
      emailStatus.textContent = "Não foi possível carregar o serviço de mensagens. Tente novamente mais tarde.";
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!emailServiceReady) return;

      const nome = document.getElementById("nome").value;
      const email = document.getElementById("email").value;
      const mensagem = document.getElementById("msg").value;
      const submitButton = form.querySelector('button[type="submit"]');

      submitButton.disabled = true;
      emailStatus.textContent = "Enviando mensagem...";

      window.emailjs.send("service_6vp4bi1", "template_4026jfk", {
        nome,
        email,
        mensagem
      }).then(() => {
        emailStatus.textContent = `Mensagem enviada com sucesso, ${nome}!`;
        form.reset();
      }).catch((error) => {
        console.error("Falha ao enviar mensagem:", error);
        emailStatus.textContent = "Não foi possível enviar a mensagem. Tente novamente.";
      }).finally(() => {
        submitButton.disabled = false;
      });
    });
  </script>
  <script src="home.js"></script>
</body>
</html>
